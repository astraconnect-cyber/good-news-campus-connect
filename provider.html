<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Become a Provider - Good News Campus Connect</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎓 Good News Campus Connect</h1>
    <p>Become a Service Provider</p>
  </header>

  <section class="hero">

    <h2>Offer Your Services</h2>

    <p>
      Join Good News Campus Connect and connect with
      students who need your services.
    </p>

    <form id="providerForm">

      <input
        type="text"
        id="fullName"
        placeholder="Full Name"
        required
      >

      <input
        type="tel"
        id="phone"
        placeholder="Phone / WhatsApp Number"
        required
      >

      <input
        type="text"
        id="university"
        placeholder="University"
        required
      >

      <select id="service" required>
        <option value="">Select your service</option>
        <option>Laundry</option>
        <option>Laptop Engineer</option>
        <option>Cleaning Services</option>
        <option>Hair Dressing</option>
        <option>Nail Technician</option>
        <option>Painter</option>
        <option>Website Developer</option>
        <option>Assignment Runs</option>
        <option>Phone Engineer</option>
        <option>Graphics Design</option>
        <option>Other Services</option>
      </select>

      <input
        type="text"
        id="location"
        placeholder="Your Campus / Location"
        required
      >

      <input
        type="number"
        id="price"
        placeholder="Starting Price (₦)"
        required
      >

      <textarea
        id="description"
        placeholder="Describe your service..."
        required
      ></textarea>

      <button type="submit">
        Register as a Provider
      </button>

    </form>

  </section>

  <footer>
    <p>© 2026 Good News Campus Connect</p>
  </footer>

  <script src="script.js"></script>

</body>
        </html>
