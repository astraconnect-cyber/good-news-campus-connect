<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Registration - Good News Campus Connect</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎓 Good News Campus Connect</h1>
    <p>Create Your Customer Account</p>
  </header>

  <section class="hero">

    <h2>Join Good News Campus Connect</h2>

    <p>
      Create an account to find services, book providers
      and discover student opportunities.
    </p>

    <form id="customerForm" onsubmit="createCustomer(event)">

      <input
        type="text"
        id="customerName"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="customerEmail"
        placeholder="Email Address"
        required
      >

      <input
        type="tel"
        id="customerPhone"
        placeholder="Phone / WhatsApp Number"
        required
      >

      <input
        type="text"
        id="customerUniversity"
        placeholder="University"
        required
      >

      <input
        type="text"
        id="customerLocation"
        placeholder="Campus / Location"
        required
      >

      <button type="submit">
        Create Customer Account
      </button>

    </form>

    <p style="margin-top:20px;">
      Already have an account?
      <a href="#">Login</a>
    </p>

  </section>

  <footer>
    <p>© 2026 Good News Campus Connect</p>
    <p>Connecting students with opportunities.</p>
  </footer>

  <script src="script.js"></script>

</body>
        </html>
