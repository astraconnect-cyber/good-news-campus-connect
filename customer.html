<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Registration - Good News Campus Connect</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎓 Good News Campus Connect</h1>
    <p>Create Your Customer Account</p>
  </header>

  <section class="hero">

    <h2>Join Good News Campus Connect</h2>

    <p>
      Create an account to find services, book providers
      and discover student opportunities.
    </p>

    <form id="customerForm" onsubmit="createCustomer(event)">

      <input
        type="text"
        id="customerName"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="customerEmail"
        placeholder="Email Address"
        required
      >
      <input
  type="password"
  id="customerPassword"
  placeholder="Create Password"
  minlength="6"
  required
>

      <input
        type="tel"
        id="customerPhone"
        placeholder="Phone / WhatsApp Number"
        required
      >

      <input
        type="text"
        id="customerUniversity"
        placeholder="University"
        required
      >

      <input
        type="text"
        id="customerLocation"
        placeholder="Campus / Location"
        required
      >

      <button type="submit">
        Create Customer Account
      </button>

    </form>

    <p style="margin-top:20px;">
      Already have an account?
      <a href="#">Login</a>
    </p>

  </section>

  <footer>
    <p>© 2026 Good News Campus Connect</p>
    <p>Connecting students with opportunities.</p>
  </footer>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "good-news-campus-connect.firebaseapp.com",
    projectId: "good-news-campus-connect",
    storageBucket: "good-news-campus-connect.firebasestorage.app",
    messagingSenderId: "301910999227",
    appId: "1:301910999227:web:e5a4fb85d33380521c299e"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  function createCustomer(event) {
    event.preventDefault();

    const name = document.getElementById("customerName").value.trim();
    const email = document.getElementById("customerEmail").value.trim();
    const password = document.getElementById("customerPassword").value;
    const phone = document.getElementById("customerPhone").value.trim();
    const university = document.getElementById("customerUniversity").value.trim();
    const location = document.getElementById("customerLocation").value.trim();

    auth.createUserWithEmailAndPassword(email, password)
      .then(function(userCredential) {

        const user = userCredential.user;

        return db.collection("customers").doc(user.uid).set({
          name: name,
          email: email,
          phone: phone,
          university: university,
          location: location,
          role: "customer",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

      })
      .then(function() {

        localStorage.setItem("customerName", name);

        alert("Account created successfully! 🎉");

        window.location.href = "customer-dashboard.html";

      })
      .catch(function(error) {

        alert("Registration failed: " + error.message);

      });
  }
</script>

</body>
  </html>

</body>
        </html>
